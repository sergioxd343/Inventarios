<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
        <link rel="stylesheet" href="assets/css/bootstrap.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <style>
            body {
                height: 100vh;
                background: linear-gradient(135deg, #6c63ff, #3a3dff);
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            .card {
                border-radius: 15px;
                padding: 2rem;
                box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            }
            .form-control:focus {
                box-shadow: none;
                border-color: #6c63ff;
            }
            .btn-primary {
                background: #6c63ff;
                border: none;
                transition: background 0.3s ease;
            }
            .btn-primary:hover {
                background: #574fd6;
            }
            .input-group-text {
                background: #f0f0f0;
                border: none;
            }
            .card-title {
                font-weight: 600;
                color: #333;
            }
        </style>
    </head>
    <body>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-4">

                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>

                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label">Usuario</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                        <input type="text" id="usuario" class="form-control" placeholder="Ingrese su usuario" required>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                        <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña" required>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">Entrar</button>
                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </div>


        <script>
            document.getElementById("loginForm").addEventListener("submit", function (e) {
                e.preventDefault();

                const correo = document.getElementById("usuario").value;
                const contrasena = document.getElementById("password").value;

                fetch("./api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({correo, contrasena})
                })
                        .then(response => {
                            if (!response.ok)
                                throw new Error("Usuario o contraseña incorrectos");
                            return response.json();
                        })
                        .then(data => {
                            localStorage.setItem("token", data.token);
                            localStorage.setItem("rol", data.idRol);

                            Swal.fire({
                                icon: "success",
                                title: "Bienvenido",
                                text: "Inicio de sesión exitoso",
                                timer: 1500,
                                showConfirmButton: false
                            }).then(() => {
                                window.location.href = "tablero.jsp";
                            });
                        })
                        .catch(err => {
                            Swal.fire({
                                icon: "error",
                                title: "Error",
                                text: err.message
                            });
                        });
            });
        </script>

    </body>

</html>
